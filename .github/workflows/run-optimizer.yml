name: Run AI Bidder Optimizer

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行 AI 投手優化流程
        run: python3 main.py
